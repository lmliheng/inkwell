server:
  port: 8092

spring:
  application:
    name: jscreator-social
  cloud:
    nacos:
      # 容器里由 compose 注入 NACOS_ADDR=nacos:8848；本机开发（scripts/dev_service.sh）默认连 127.0.0.1
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:fastweb_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 原版用 mysql2，SELECT 出来的 NULL 列在 JSON 里是 "键: null"；MyBatis 默认会整列丢掉键。
    # 打开这个开关，Map 结果的键集合才能与原版一致（前端按固定字段取值，缺键会显示成 undefined）。
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jscreator:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
