server:
  port: 8088

spring:
  application:
    name: jscreator-gateway
  cloud:
    nacos:
      # 容器里由 compose 注入 NACOS_ADDR=nacos:8848；本机开发默认连 127.0.0.1
      discovery:
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      # 路由目标用 lb://<服务名>，由 Nacos 提供实例列表（服务名 = 各服务的 spring.application.name）。
      # 原先写死的 AUTH_SERVICE_URL 之类环境变量已不再需要。
      routes:
        # ---------- auth 服务：认证 / 用户 / 角色 / OAuth / API Key ----------
        - id: auth-sys
          uri: lb://jscreator-auth
          predicates:
            - Path=/sys/login,/sys/register,/sys/profile,/resetPassword
        - id: auth-email-github-totp
          uri: lb://jscreator-auth
          predicates:
            - Path=/email/**,/auth/github/**,/totp/**
        - id: auth-oauth
          uri: lb://jscreator-auth
          predicates:
            - Path=/oauth/**
        - id: auth-user-manage
          uri: lb://jscreator-auth
          predicates:
            - Path=/user-manage/**,/userInfo,/userInfo/**,/api-keys/**,/api-keys
        - id: auth-rbac
          uri: lb://jscreator-auth
          predicates:
            - Path=/role/**,/permission/**
        # 开放 API（/api/v1/*）走 API Key 鉴权，原版里归 openapi 模块，所以放 auth 服务；
        # 注意它与 content 的 /article/** 不是一回事，别混到 content 上。
        - id: auth-openapi
          uri: lb://jscreator-auth
          predicates:
            - Path=/api/v1/**

        # ---------- content 服务：文章 / 评论 / 博客 / 上传 / 广告 / 公告 ----------
        - id: content-api
          uri: lb://jscreator-content
          predicates:
            - Path=/article/**,/comment/**,/blog/**,/upload/image
        - id: content-ops
          uri: lb://jscreator-content
          predicates:
            - Path=/ad/**,/announcement/**

        # ---------- social 服务：关注 / 点赞 / 收藏 / 私信 / 通知 ----------
        - id: social-api
          uri: lb://jscreator-social
          predicates:
            - Path=/social/**,/dm/**,/notification/**

        # ---------- system 服务：监控 / 备份 ----------
        - id: system-api
          uri: lb://jscreator-system
          predicates:
            - Path=/system-monitor/**,/system-monitor,/backup/**

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: ${FRONTEND_URLS:http://127.0.0.1:5173,http://localhost:5173,http://127.0.0.1:8085,http://localhost:8085}
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
