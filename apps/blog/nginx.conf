# 博客前端（Blog）—— nginx 静态托管 + /api 反代网关
# 由 apps/blog/Dockerfile 拷进镜像的 /etc/nginx/conf.d/default.conf
#
# 与后台不同：博客是对外站点，这里**不设来源 IP 白名单**。
server {
    listen       80;
    server_name  _;

    root  /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1k;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # Docker 内嵌 DNS + 变量，gateway 容器重建换 IP 时不用重启本容器（同 admin）
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8088;

    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $gateway;
        proxy_http_version 1.1;
        # 必须用 $http_host（带端口）。后端网关用 Spring 的默认 CORS 处理器，
        # 它按 scheme+host+port 判断是不是跨域请求：浏览器发向 http://host:8080/api 的 POST
        # 带 Origin: http://host:8080，若这里把 Host 改写成不带端口的 $host，网关就会当成
        # 「来自 http://host:8080 的跨域请求」，而它不在 FRONTEND_URLS 白名单里 → 403。
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（vite 产物文件名带 hash）
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
