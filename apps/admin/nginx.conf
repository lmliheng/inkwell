# 后台前端（Admin）—— nginx 静态托管 + /api 反代网关
# 由 apps/admin/Dockerfile 拷进镜像的 /etc/nginx/conf.d/default.conf
server {
    listen       80;
    server_name  _;

    # 来源白名单：由容器启动脚本 /docker-entrypoint.d/10-allow-hosts.sh 依据环境变量
    # ADMIN_ALLOW_HOSTS 生成（默认只放行本机与 docker 私网段）。自己的出口 IP 写进 .env，
    # 不进仓库 —— 理由与用法见 apps/admin/allow-hosts.sh 顶部。
    include /etc/nginx/inkwell-allow.conf;

    root  /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;   # 后台的文章封面/头像上传

    # Docker 内嵌 DNS。用变量 + resolver 让 nginx 每次请求重新解析 gateway 的名字：
    # 直接写死 proxy_pass http://gateway:8088/ 的话，nginx 只在启动时解析一次，
    # gateway 容器一重建（换 IP）就会持续 502，直到本容器也重启。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8088;

    # 前端 axios baseURL 是 /api，这里去掉前缀转发给网关（网关按原路径分派）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $gateway;
        proxy_http_version 1.1;
        # 用 $http_host 而不是 $host：前者保留端口。后台若不在 80 端口，$host 会把端口抹掉，
        # 网关的 CORS 处理器便认为浏览器的 POST 是跨域请求而 403（详见 apps/blog/nginx.conf 注释）。
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # vue-router 是 history 模式，未命中的路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
