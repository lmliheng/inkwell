# JScreator 后台前端（Admin 构建产物）—— nginx 静态托管 + /api 反代网关
# 挂载到容器的 /etc/nginx/conf.d/default.conf
server {
    listen       80;
    server_name  _;

    # 只放行指定来源，其余一律 403（IP 变动时改这里再 docker compose restart web）
    allow <你的固定出口IP>;    # 固定出口 IP
    allow <你的手机出口IP>;   # 手机
    allow 127.0.0.1;        # 本机自测
    allow ::1;
    allow 172.18.0.0/16;    # 本机经 docker 端口映射进来的请求，源地址是 compose 网桥（172.18.0.1）
    deny  all;

    root  /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20m;

    # Docker 内嵌 DNS。用变量 + resolver 让 nginx 每次请求重新解析 gateway 的名字：
    # 直接写死 proxy_pass http://gateway:8088/ 的话，nginx 只在启动时解析一次，
    # gateway 容器一重建（换 IP）就会持续 502，直到 web 也重启。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $auth_upstream http://gateway:8088;

    # 前端 axios baseURL 是 /api，这里去掉前缀转发给网关（网关按原路径分派）
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass         $auth_upstream;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # vue-router 是 history 模式，未命中的路径回落到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
