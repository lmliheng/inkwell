server:
  port: 8090

spring:
  application:
    name: jscreator-auth
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:fastweb_test}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false&allowMultiQueries=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5      # 小机器：别让连接池把内存吃掉
      minimum-idle: 1
      connection-timeout: 10000

# 与 Node 版保持一致：结果集的列名原样保留（role_name 不变成 roleName、checkinDay 不变），
# 实体映射靠 @TableField 显式声明，Map 结果靠 SQL 里的别名控制。
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 原版用 mysql2，SELECT 出来的 NULL 列在 JSON 里是 "键: null"；MyBatis 默认会整列丢掉键。
    # 打开这个开关，Map 结果的键集合才能与原版一致（前端按固定字段取值，缺键会显示成 undefined）。
    call-setters-on-nulls: true
  global-config:
    banner: false
    db-config:
      id-type: auto

jscreator:
  jwt:
    secret: ${JWT_SECRET:}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: info
    com.jscreator: info
